<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6C3FE8">
<meta name="description" content="Charade Parade: hold the tablet to your forehead while everyone acts it out.">
<link rel="manifest" href="manifest.webmanifest">

<title>Charade Parade</title>
<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{
  --bg:#F2EEFB; --surface:#fff; --ink:#1E1B3A; --muted:#5d5880; --edge:#d6cfee;
  --violet:#6C3FE8; --violet-deep:#4B23C2; --violet-soft:#E8E0FF;
  --coral:#FF6B5A; --good:#17A45F; --pass:#F08A24;
  --shadow:0 2px 0 rgba(30,27,58,.08),0 8px 24px rgba(30,27,58,.08);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13112a; --surface:#1f1c3d; --ink:#f0eefc; --muted:#aaa4d0; --edge:#2f2a57;
  --violet:#8B66FF; --violet-deep:#8B66FF; --violet-soft:#2c2560; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13112a; --surface:#1f1c3d; --ink:#f0eefc; --muted:#aaa4d0; --edge:#2f2a57;
  --violet:#8B66FF; --violet-deep:#8B66FF; --violet-soft:#2c2560; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.home{align-self:flex-start;color:var(--muted);font-weight:800;text-decoration:none;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:clamp(28px,7vw,40px);font-weight:700}
.brand p{margin:0;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted);margin:0;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--violet);color:#fff;font-family:var(--display);font-weight:600;font-size:20px;padding:14px 22px;border-radius:16px;box-shadow:0 4px 0 var(--violet-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--violet-deep)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge)}
.btn.small{font-size:16px;padding:10px 14px;border-radius:12px}
.btn.big{font-size:24px;padding:18px 28px;width:100%}
.btn:disabled{opacity:.5}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.player{display:flex;gap:6px;background:var(--bg);border-radius:14px;padding:6px}
.player input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--edge);border-radius:10px;padding:8px 10px}
.remove{background:transparent;color:var(--muted);font-size:24px;width:40px;border-radius:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:var(--bg);border-radius:12px;padding:10px;font-weight:800;box-shadow:inset 0 0 0 2px var(--edge)}
.seg button[aria-pressed="true"]{background:var(--violet-soft);box-shadow:inset 0 0 0 3px var(--violet)}
.rules{margin:0;padding-left:20px;color:var(--muted);font-weight:600}
.rules li+li{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--shadow);font-weight:800}
.chip b{font-family:var(--display);background:var(--bg);border-radius:999px;min-width:30px;text-align:center;padding:2px 8px;font-variant-numeric:tabular-nums}
.chip.now{box-shadow:inset 0 0 0 3px var(--violet),var(--shadow)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.deck{background:var(--bg);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:inset 0 0 0 2px var(--edge);line-height:1.15}
.deck:active{transform:scale(.97)}
.deck .em{font-size:40px;line-height:1}
.deck b{font-family:var(--display);font-weight:600;font-size:18px}
.deck small{color:var(--muted);font-weight:700;font-size:12px}
.group-title{font-family:var(--display);font-weight:600;font-size:19px;margin-top:4px}
.turn h2{font-size:clamp(28px,7vw,40px)}
.hold{display:flex;gap:16px;align-items:center}
.hold svg{flex:none}
.recap{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.recap button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:800}
.recap .mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:15px}
.recap .ok .mark{background:var(--good)}
.recap .no .mark{background:var(--pass)}
.recap .no{color:var(--muted)}
.score-big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--violet);line-height:1}
.podium{display:flex;flex-direction:column;gap:8px}
.place{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:800;font-size:18px}
.place .medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--edge);font-family:var(--display)}
.place.first .medal{background:#FFC83D;color:#1E1B3A}
.place .pts{margin-left:auto;font-family:var(--display);font-size:22px}

/* Play screen: covers everything, readable from across the room */
#stage{position:fixed;inset:0;z-index:10;background:var(--violet);color:#fff;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none;transition:background .15s}
#stage.good{background:var(--good)}
#stage.pass{background:var(--pass)}
#stage.over{background:var(--coral)}
.st-top{display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-family:var(--display);font-weight:600;font-size:clamp(20px,4vw,34px);position:relative;z-index:2;pointer-events:none}
.st-top>*{pointer-events:auto}
.timer{background:rgba(0,0,0,.18);border-radius:999px;padding:4px 18px;font-variant-numeric:tabular-nums}
.timer.low{background:#fff;color:var(--coral)}
.stop{background:rgba(0,0,0,.18);color:#fff;border-radius:999px;padding:8px 16px;font-family:var(--body);font-weight:800;font-size:16px}
.st-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center;gap:2vh;min-height:0}
.st-emoji{font-size:min(22vh,22vw);line-height:1}
.st-word{font-family:var(--display);font-weight:700;line-height:1.05;max-width:100%;overflow-wrap:break-word}
.st-hint{font-weight:800;opacity:.85;font-size:clamp(16px,2.6vw,24px)}
.zones{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;z-index:1}
.zones button{background:transparent;color:rgba(255,255,255,.85);font-family:var(--display);font-weight:600;font-size:clamp(18px,3vw,28px);display:flex;align-items:flex-end;padding:0 0 max(18px,env(safe-area-inset-bottom,0px));justify-content:center}
.zones button:active{background:rgba(255,255,255,.12)}

.big-count{font-family:var(--display);font-weight:700;font-size:min(40vh,40vw);line-height:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){#stage{transition:none}}
</style>
</head>

/* ---------- Sound & buzz ---------- */
let ac=null;
function tone(freqs,dur=.12,type="sine",vol=.25){
  if(!ac)return;const t0=ac.currentTime;
  freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    const s=t0+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+dur*1.6);
    o.connect(g).connect(ac.destination);o.start(s);o.stop(s+dur*1.8)});
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sfx={good:()=>{tone([660,880,1100],.09);buzz(60)},pass:()=>{tone([300,220],.12,"triangle");buzz([30,40,30])},tick:()=>tone([1200],.05,"square",.08),go:()=>tone([520,780],.12),over:()=>{tone([440,330,220],.22,"sawtooth",.18);buzz(400)}};

/* ---------- Tilt ----------
   Uses gravity on the axis that points out of the screen. Held upright on a forehead it reads about 0.
   Screen tipped toward the floor goes strongly negative (got it); toward the ceiling, positive (pass).
   Works the same in either landscape direction. The sign is checked when Start is tapped, while the
   screen faces the player, in case a browser reports gravity flipped. */
const T={z:0,seen:false,sign:1,armed:false,over:0,dir:0};
addEventListener("devicemotion",e=>{
  const g=e.accelerationIncludingGravity;if(!g||g.z==null)return;
  T.seen=true;T.z=T.z*.6+g.z*.4;
  if(!P||!P.live||!A.tilt||P.lockUntil>performance.now())return;
  const z=T.z*T.sign;
  if(Math.abs(z)<4){T.armed=true;T.dir=0;return}
  if(!T.armed)return;
  const dir=z<-7?1:z>7?-1:0;
  if(!dir){T.dir=0;return}
  if(dir!==T.dir){T.dir=dir;T.over=performance.now();return}
  if(performance.now()-T.over>120){T.armed=false;T.dir=0;answer(dir===1)}
});

/* ---------- Play ---------- */
let P=null,wake=null;
function drawDeck(id){
  const d=DECKS.find(x=>x.id===id),all=d.cards.map((_,i)=>i);
  let u=(used[id]||[]).filter(i=>i<all.length);
  if(all.length-u.length<12)u=[];
  const fresh=all.filter(i=>!u.includes(i));
  for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}
  used[id]=u;return {d,order:fresh};
}
async function startTurn(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  if(A.tilt&&window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==="function"){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
  T.sign=T.seen&&T.z<-3?-1:1;T.armed=false;
  try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:"hide"})}catch(e){}
  try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}catch(e){}
  try{wake=navigator.wakeLock?await navigator.wakeLock.request("screen"):null}catch(e){wake=null}
  const {d,order}=drawDeck(A.deckId);
  P={d,order,idx:-1,live:false,lockUntil:0,end:0,left:A.time,timer:null,lastTick:null};
  A.cards=[];
  stage.hidden=false;stage.className="";
  let n=3;
  const count=()=>{
    if(n===0){go();return}
    stage.innerHTML=`<div class="st-main"><div class="st-hint">Forehead time, ${esc(guesser())}!</div><div class="big-count">${n}</div><div class="st-hint">${d.em} ${esc(d.name)}</div></div>`;
    tone([440],.08);n--;P.timer=setTimeout(count,1000);
  };
  count();
}
function go(){
  sfx.go();
  stage.innerHTML=`
    <div class="st-top"><span class="timer" id="tm">${A.time}</span><button class="stop" id="stop">Stop</button><span id="got">0 ✓</span></div>
    <div class="zones"><button id="zpass" aria-label="Pass">‹ Pass</button><button id="zgood" aria-label="Got it">Got it ›</button></div>
    <div class="st-main" id="card" style="pointer-events:none"></div>`;
  $("zpass").onpointerdown=e=>{e.preventDefault();answer(false)};
  $("zgood").onpointerdown=e=>{e.preventDefault();answer(true)};
  $("stop").onclick=()=>{if(!A.quitArmed){A.quitArmed=true;$("stop").textContent="Tap again to stop";setTimeout(()=>{A.quitArmed=false;const s=$("stop");if(s)s.textContent="Stop"},2500)}else{A.quitArmed=false;finish(false)}};
  P.live=true;P.end=performance.now()+A.time*1000;
  nextCard();
  P.timer=setInterval(clock,100);
}
function clock(){
  const left=Math.max(0,Math.ceil((P.end-performance.now())/1000));
  if(left!==P.left){P.left=left;const tm=$("tm");if(tm){tm.textContent=left;tm.classList.toggle("low",left<=5)}if(left<=5&&left>0)sfx.tick()}
  if(left<=0)finish(true);
}
function nextCard(){
  P.idx++;
  if(P.idx>=P.order.length){const r=drawDeck(P.d.id);P.order=P.order.concat(r.order);}
  const c=P.d.cards[P.order[P.idx]];
  const card=$("card");
  card.innerHTML=`${c.e?`<div class="st-emoji">${c.e}</div>`:""}<div class="st-word" id="word">${esc(c.t)}</div>`;
  fit($("word"),!!c.e);
}
function fit(el,hasEmoji){
  const W=innerWidth-48,H=innerHeight*(hasEmoji?.32:.55);
  let s=Math.min(innerWidth*.16,innerHeight*(hasEmoji?.2:.3));
  el.style.fontSize=s+"px";
  while(s>24&&(el.scrollWidth>W||el.offsetHeight>H)){s*=.92;el.style.fontSize=s+"px"}
}
function answer(ok){
  if(!P||!P.live||P.lockUntil>performance.now())return;
  const c=P.d.cards[P.order[P.idx]];
  A.cards.push({t:c.t,e:c.e,ok});
  (used[P.d.id]=used[P.d.id]||[]).push(P.order[P.idx]);
  const got=A.cards.filter(x=>x.ok).length;$("got").textContent=got+" ✓";
  ok?sfx.good():sfx.pass();
  P.lockUntil=performance.now()+650;
  stage.className=ok?"good":"pass";
  $("card").innerHTML=`<div class="st-word" style="font-size:min(16vw,22vh)">${ok?"Got it!":"Pass"}</div>`;
  setTimeout(()=>{if(!P||!P.live)return;stage.className="";nextCard()},650);
}
function finish(timeUp){
  if(!P)return;
  clearInterval(P.timer);clearTimeout(P.timer);
  const wasLive=P.live;P.live=false;
  // A word left on screen when time runs out counts as a pass so the recap shows it
  if(wasLive&&P.idx>=0&&A.cards.length<P.idx+1){const c=P.d.cards[P.order[P.idx]];A.cards.push({t:c.t,e:c.e,ok:false})}
  const g=guesser();A.scores[g]=(A.scores[g]||0)+A.cards.filter(c=>c.ok).length;
  saveUsed();
  const done=()=>{stage.hidden=true;stage.innerHTML="";P=null;
    try{wake&&wake.release()}catch(e){}wake=null;
    try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
    try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
    A.screen="recap";saveGame();render();if(A.cards.filter(c=>c.ok).length>=5)setTimeout(confetti,150)};
  if(timeUp&&wasLive){sfx.over();stage.className="over";stage.innerHTML=`<div class="st-main"><div class="st-word" style="font-size:min(16vw,24vh)">Time's up!</div><div class="st-hint">Look at the screen, ${esc(g)}</div></div>`;setTimeout(done,1800)}
  else done();
}
document.addEventListener("visibilitychange",async()=>{if(!document.hidden&&P&&P.live&&navigator.wakeLock){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}});

/* ---------- Confetti ---------- */
const cv=$("confetti"),cx=cv.getContext("2d");let bits=[],raf=null;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=innerWidth;cv.height=innerHeight;const cols=["#6C3FE8","#FF6B5A","#FFC83D","#17A45F","#7fb2ff"];
  for(let i=0;i<90;i++)bits.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,life:0});
  if(!raf)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.vy+=.35;b.x+=b.vx;b.y+=b.vy;b.a+=.2;b.life++;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillStyle=b.c;cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*1.6);cx.restore()});
  bits=bits.filter(b=>b.y<cv.height+20&&b.life<200);
  raf=bits.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cv.width,cv.height),null);
}
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
