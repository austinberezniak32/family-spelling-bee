<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4B324">
<meta name="description" content="Family Game Night: a spelling bee and a charades game for the whole family.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Family Game Night</title>
<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito.woff2) format("woff2");font-weight:200 1000;font-display:swap}
:root{--bg:#EEF0F8;--surface:#fff;--ink:#1E1F3A;--muted:#5c6080;--shadow:0 2px 0 rgba(30,31,58,.08),0 10px 28px rgba(30,31,58,.10);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12142a;--surface:#1e2140;--ink:#eef0fa;--muted:#a6abcc;--shadow:0 2px 0 rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142a;--surface:#1e2140;--ink:#eef0fa;--muted:#a6abcc;--shadow:0 2px 0 rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{text-align:center}
h1,h2{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:clamp(34px,8vw,56px);font-weight:700}
header p{margin:6px 0 0;color:var(--muted);font-weight:700;font-size:18px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.game{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;text-decoration:none;color:#1E1F3A;border-radius:28px;padding:28px 20px 24px;box-shadow:var(--shadow);transition:transform .1s;min-height:300px;justify-content:center}
.game:active{transform:scale(.98)}
.game:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.bee{background:linear-gradient(160deg,#FFD65C,#F4B324)}
.act{background:linear-gradient(160deg,#8D68FF,#6C3FE8);color:#fff}
.game h2{font-size:clamp(28px,5vw,36px);font-weight:700}
.game p{margin:0;font-weight:700;font-size:17px;opacity:.85;max-width:30ch}
.game .play{margin-top:6px;font-family:var(--display);font-weight:600;font-size:20px;padding:10px 26px;border-radius:999px;background:rgba(255,255,255,.85);color:#1E1F3A}
.act .play{color:#4B23C2}
.game svg{width:110px;height:110px}
.foot{text-align:center;color:var(--muted);font-weight:600;margin:0}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>Family Game Night</h1><p>Pick a game. Pass the tablet. Have fun!</p></header>
  <nav class="games">
    <a class="game bee" href="bee.html">
      <svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="22" cy="20" rx="11" ry="8" fill="#fff" opacity=".9" transform="rotate(-25 22 20)"/><ellipse cx="38" cy="18" rx="11" ry="8" fill="#fff" opacity=".9" transform="rotate(20 38 18)"/><ellipse cx="32" cy="38" rx="18" ry="14" fill="#FFE9A8" stroke="#1B2740" stroke-width="2"/><path d="M26 25.5c-1.6 3.8-1.6 21.2 0 25M36 24.5c1.6 4.2 1.6 22.6 0 27" stroke="#1B2740" stroke-width="5" fill="none"/><circle cx="46" cy="34" r="2.4" fill="#1B2740"/><path d="M14 38l-5 1.5" stroke="#1B2740" stroke-width="3" stroke-linecap="round"/></svg>
      <h2>Spelling Bee</h2>
      <p>Spell around the circle. Run out of hearts and you're out.</p>
      <span class="play">Play</span>
    </a>
    <a class="game act" href="act.html">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 10c8 3 18 3 26 0v16c0 10-6 17-13 17S6 36 6 26z" fill="#fff"/><circle cx="13" cy="22" r="3" fill="#6C3FE8"/><circle cx="25" cy="22" r="3" fill="#6C3FE8"/><path d="M12 31c4 4 10 4 14 0" stroke="#6C3FE8" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M30 22c8 3 18 3 28 0v16c0 10-6 17-14 17s-14-7-14-17z" fill="#FF6B5A"/><circle cx="38" cy="34" r="3" fill="#fff"/><circle cx="50" cy="34" r="3" fill="#fff"/><path d="M37 46c4-4 10-4 14 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <h2>Charade Parade</h2>
      <p>Tablet on your forehead. Everyone acts it out. Guess fast!</p>
      <span class="play">Play</span>
    </a>
  </nav>
  <p class="foot">Works offline once it's on your home screen.</p>
</main>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
